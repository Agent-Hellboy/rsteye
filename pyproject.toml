[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsteye"
version = "1.0.9"
description = "Desktop reminder app for breathing breaks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow",
  "python-dotenv",
]

[project.scripts]
rsteye = "rsteye.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rsteye = ["resources/*.gif", "resources/*.png"]

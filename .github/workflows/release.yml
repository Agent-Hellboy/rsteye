name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-macos:
    name: Publish for macOS
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[build]'

      - name: Validate resources
        run: python scripts/validate_resources.py

      - name: Build application bundle
        run: |
          python -m PyInstaller --clean --noconfirm --name RstEyeApp \
            --onedir --windowed --paths src \
            --add-data "src/rsteye/resources/med.gif:rsteye/resources" \
            --add-data "src/rsteye/resources/rsteye.png:rsteye/resources" \
            --icon=packaging/macos/pkg/RstEyeIcon.icns \
            --osx-bundle-identifier com.rsteye.rsteye \
            --hidden-import=PIL.ImageTk \
            --additional-hooks-dir=packaging/pyinstaller/hooks app.py
          test -d dist/RstEyeApp.app

      - name: Build installer
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkgbuild --component dist/RstEyeApp.app \
            --scripts packaging/macos/pkg/scripts \
            --identifier com.rsteye.rsteye --version "$version" \
            --install-location /Applications packaging/macos/pkg/RstEyeApp.pkg
          productbuild --distribution packaging/macos/pkg/distribution.xml \
            --resources packaging/macos/pkg/resources \
            --package-path packaging/macos/pkg \
            "dist/RstEyeAppInstaller_${version}.pkg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/RstEyeAppInstaller_*.pkg

  publish-ubuntu:
    name: Publish for Ubuntu
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev python3-tk

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[build]'

      - name: Validate resources
        run: python scripts/validate_resources.py

      - name: Build application binary
        run: |
          python -m PyInstaller --clean --noconfirm --name rsteye \
            --onefile --windowed --paths src \
            --add-data "src/rsteye/resources/med.gif:rsteye/resources" \
            --add-data "src/rsteye/resources/rsteye.png:rsteye/resources" \
            --hidden-import=PIL.ImageTk \
            --additional-hooks-dir=packaging/pyinstaller/hooks app.py

      - name: Build Debian package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build/deb/DEBIAN build/deb/usr/bin build/deb/etc/xdg/autostart
          cp dist/rsteye build/deb/usr/bin/rsteye
          cp packaging/linux/debian/control build/deb/DEBIAN/control
          cp packaging/linux/debian/postinst build/deb/DEBIAN/postinst
          cp packaging/linux/debian/postrm build/deb/DEBIAN/postrm
          cp packaging/linux/rsteye.desktop build/deb/etc/xdg/autostart/rsteye.desktop
          sed -i "s/^Version:.*/Version: ${version}/" build/deb/DEBIAN/control
          chmod 755 build/deb/DEBIAN/postinst build/deb/DEBIAN/postrm
          dpkg-deb --build --root-owner-group build/deb "dist/rsteye_${version}_amd64.deb"

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-package
          path: dist/rsteye_*.deb

  publish-release:
    name: Publish release assets
    needs: [publish-macos, publish-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
